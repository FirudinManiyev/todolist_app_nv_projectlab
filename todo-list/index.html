<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Decorative floating background blobs -->
    <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-3" aria-hidden="true"></div>

    <main class="container">
        <header class="header">
            <h1 class="title">
                <span class="title-icon" aria-hidden="true">✓</span>
                My To-Do List
            </h1>
            <p class="subtitle">Stay organized, one task at a time.</p>
        </header>

        <section class="input-section" aria-label="Add a new task">
            <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </span>
                <input
                    type="text"
                    id="taskInput"
                    class="task-input"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    maxlength="200"
                >
            </div>
            <button id="addBtn" class="add-btn" type="button" aria-label="Add task">
                <span>Add Task</span>
            </button>
        </section>

        <p id="warning" class="warning" role="alert" aria-live="polite"></p>

        <section class="list-section" aria-label="Tasks">
            <ul id="taskList" class="task-list"></ul>

            <div id="emptyState" class="empty-state" hidden>
                <div class="empty-icon" aria-hidden="true">📝</div>
                <p class="empty-title">No tasks yet</p>
                <p class="empty-subtitle">Add your first task to get started.</p>
            </div>
        </section>

        <footer class="footer">
            <div class="stats">
                <span class="stat">
                    <span class="stat-dot stat-dot--total"></span>
                    <span id="totalCount">0</span> total
                </span>
                <span class="stat">
                    <span class="stat-dot stat-dot--done"></span>
                    <span id="doneCount">0</span> done
                </span>
            </div>
            <button id="clearBtn" class="clear-btn" type="button" hidden>
                Clear completed
            </button>
        </footer>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
