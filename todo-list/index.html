<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1 class="title">My To-Do List</h1>
            <p class="subtitle">Stay organized, one task at a time.</p>
        </header>

        <section class="input-section">
            <input
                type="text"
                id="taskInput"
                class="task-input"
                placeholder="Enter a new task..."
                autocomplete="off"
            >
            <button id="addBtn" class="add-btn" type="button">Add Task</button>
        </section>

        <p id="warning" class="warning" role="alert" aria-live="polite"></p>

        <ul id="taskList" class="task-list" aria-label="Task list"></ul>

        <footer class="footer">
            <span id="taskCount" class="task-count">0 tasks</span>
        </footer>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
